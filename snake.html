<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뱀 게임</title>
<style>
  /* 화면 색깔 설정 */
  body {
    margin: 0;
    min-height: 100vh;
    background: #1e1e2e;
    color: #eee;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .wrap { display: flex; gap: 24px; align-items: flex-start; padding: 16px; }
  canvas { background: #111; border: 2px solid #555; display: block; }
  .panel { min-width: 170px; }
  .panel div { margin: 8px 0; font-size: 18px; }
  .panel h2 { margin: 0 0 10px; }
  button { font-size: 16px; padding: 8px 14px; cursor: pointer; margin-top: 8px; }
  #msg { color: #ffd166; min-height: 22px; }
  .help { font-size: 14px; line-height: 1.7; color: #bbb; }
</style>
</head>
<body>
<div class="wrap">
  <!-- 뱀이 움직이는 게임 판 -->
  <canvas id="board" width="400" height="400"></canvas>

  <div class="panel">
    <h2>뱀 게임</h2>
    <div>점수: <span id="score">0</span></div>
    <div>최고 점수: <span id="best">0</span></div>
    <div id="msg"></div>
    <button id="restart">다시 시작</button>
    <p class="help">
      방향키 : 뱀 방향 바꾸기<br>
      Space / 방향키 : 시작<br>
      P : 일시정지<br>
      빨간 점을 먹으면 길어져요.<br>
      벽이나 내 몸에 닿으면 끝!
    </p>
  </div>
</div>

<script>
  // ===== 기본 설정 =====
  const SIZE = 20;        // 게임 판은 가로 20칸 x 세로 20칸
  const CELL = 20;        // 칸 한 개의 크기 (픽셀)
  const TICK_MS = 120;    // 뱀이 한 칸 움직이는 시간 (작을수록 빠름)

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');

  // 게임 상태를 담는 변수들
  let snake;      // 뱀의 몸통. 배열의 첫 번째 칸이 머리
  let dir;        // 지금 움직이는 방향 {x, y}
  let food;       // 먹이 위치 {x, y}
  let score;      // 현재 점수
  let best = 0;   // 최고 점수
  let running;    // 게임이 시작되었는지
  let paused;     // 일시정지 여부
  let over;       // 게임이 끝났는지
  let timer;      // 뱀을 움직이는 타이머

  // 저장된 최고 점수를 불러온다 (저장이 안 되는 환경이면 0으로 둔다)
  try {
    best = Number(localStorage.getItem('snakeBest')) || 0;
  } catch (e) {
    best = 0;
  }

  // ===== 도우미 함수 =====

  // 두 위치가 같은 칸인지 확인
  function sameCell(a, b) {
    return a.x === b.x && a.y === b.y;
  }

  // 뱀 몸통이 있는 칸을 피해서 먹이를 아무 곳에나 놓는다
  function placeFood() {
    while (true) {
      const p = {
        x: Math.floor(Math.random() * SIZE),
        y: Math.floor(Math.random() * SIZE),
      };
      // 뱀 몸통과 겹치지 않으면 그 자리에 놓는다
      if (!snake.some(s => sameCell(s, p))) {
        food = p;
        return;
      }
    }
  }

  // ===== 그리기 =====
  function draw() {
    // 배경
    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 먹이 (빨간 원)
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();

    // 뱀 몸통 (초록색), 머리는 조금 더 진하게
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? '#7CFC00' : '#2e8b57';
      ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2);
    });

    // 일시정지 / 게임 오버 안내 글씨
    if (paused || over) {
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(over ? '게임 오버' : '일시정지', canvas.width / 2, canvas.height / 2);
      ctx.textAlign = 'left';
    }
  }

  // 점수판 갱신
  function updateInfo() {
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = best;
  }

  // 아래 메시지 칸에 글 표시
  function showMsg(text) {
    document.getElementById('msg').textContent = text;
  }

  // ===== 게임 흐름 =====

  // 게임을 처음부터 다시 준비한다
  function startGame() {
    const mid = Math.floor(SIZE / 2);
    // 가운데에서 시작, 몸통 길이 3, 오른쪽을 향함
    snake = [
      { x: mid, y: mid },
      { x: mid - 1, y: mid },
      { x: mid - 2, y: mid },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };   // 이전 게임의 방향 입력이 남지 않도록 같이 초기화
    score = 0;
    running = false;
    paused = false;
    over = false;
    placeFood();
    updateInfo();
    showMsg('방향키나 Space 를 누르면 시작해요');

    // 타이머는 한 번만 켜 둔다 (게임이 시작되기 전에는 tick 이 아무 일도 안 함)
    clearInterval(timer);
    timer = setInterval(tick, TICK_MS);
    draw();
  }

  // 게임 오버 처리
  function gameOver() {
    over = true;
    running = false;
    if (score > best) {
      best = score;
      try {
        localStorage.setItem('snakeBest', String(best));
      } catch (e) {
        // 저장이 안 돼도 게임은 계속 되게 무시
      }
    }
    updateInfo();
    showMsg('게임 오버! 다시 시작 버튼이나 R 키를 누르세요.');
    draw();
  }

  // 타이머가 울릴 때마다 뱀을 한 칸 움직인다
  function tick() {
    if (!running || paused || over) return;

    dir = nextDir;   // 키 입력으로 정해진 방향을 적용

    // 새 머리 위치 계산
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 벽에 부딪혔는지 확인
    if (head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE) {
      gameOver();
      return;
    }

    // 먹이를 먹는지 확인
    const eat = sameCell(head, food);

    // 내 몸에 부딪혔는지 확인
    // 먹지 않으면 꼬리가 한 칸 줄어드니까 맨 끝 칸은 검사에서 뺀다
    const body = eat ? snake : snake.slice(0, -1);
    if (body.some(s => sameCell(s, head))) {
      gameOver();
      return;
    }

    // 머리를 앞에 추가
    snake.unshift(head);

    if (eat) {
      score += 10;
      placeFood();
      updateInfo();
    } else {
      snake.pop();   // 먹지 않았으면 꼬리를 떼서 길이를 유지
    }

    draw();
  }

  // 방향 키 입력 기억 (tick 에서 실제로 적용)
  let nextDir = { x: 1, y: 0 };

  // ===== 키보드 조작 =====
  const KEY_DIRS = {
    ArrowUp:    { x: 0,  y: -1 },
    ArrowDown:  { x: 0,  y: 1 },
    ArrowLeft:  { x: -1, y: 0 },
    ArrowRight: { x: 1,  y: 0 },
  };

  document.addEventListener('keydown', (e) => {
    // 화살표 키와 스페이스 키로 화면이 스크롤되지 않게 막는다
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
      e.preventDefault();
    }

    // R 키: 다시 시작
    if (e.key === 'r' || e.key === 'R') {
      startGame();
      return;
    }
    if (over) return;   // 게임이 끝났으면 나머지 키는 무시

    // P 키: 일시정지 / 계속하기
    if (e.key === 'p' || e.key === 'P') {
      if (!running) return;
      paused = !paused;
      showMsg(paused ? '일시정지 중 (P 를 누르면 계속)' : '');
      draw();
      return;
    }

    // Space 키: 아직 시작 전이면 시작
    if (e.key === ' ' && !running) {
      running = true;
      showMsg('');
      return;
    }

    const want = KEY_DIRS[e.key];
    if (!want) return;

    // 아직 시작 전이면 방향 키로도 시작
    if (!running) {
      running = true;
      showMsg('');
    }

    // 바로 반대 방향으로 가는 입력은 무시 (몸이 자기 목을 무는 것을 막기 위함)
    // 예: 오른쪽으로 가는 중에 왼쪽 키를 누르면 무시
    if (want.x === -dir.x && want.y === -dir.y) return;

    nextDir = want;
  });

  // 다시 시작 버튼
  document.getElementById('restart').addEventListener('click', () => {
    startGame();
  });

  // 페이지가 열리면 바로 준비
  startGame();
</script>
</body>
</html>
